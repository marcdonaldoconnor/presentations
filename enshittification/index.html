		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){

			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}

			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

# Enshittification<!-- .element: class="r-fit-text" -->

#### Why we need a more socialist, decentralised internet

notes: The internet is getting worse every day. Or at least, that's what Cory Doctorow wants you to think.

- State my scope

Cory Doctorow's theory of enshittification is a fantastic explanation for how the internet has evolved over time, but his proposed solutions to create a new web turns a blind eye to the core foundation of the internet.

##### Part 1:

## How did we get here?

notes: "Here is how platforms die: first, they are good to their users; then they abuse their users to make things better for their business customers; finally, they abuse those business customers to claw back all the value for themselves. Then, they die." These words, written by Cory Doctorow for his blog, `pluralistic.net`, in early 2023, are the shortest, most succinct definition of enshittifcation. It outlines a 3 step process for the lifetime of online platforms, each step defined by how these platforms allocate "surplus value," essentially a fancy word for "profit".
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

The 3 step process: <!-- .element: class="fragment semi-fade-out" data-fragment-index="1" -->

1. Users <!-- .element: class="fragment fade-in-then-semi-out" data-fragment-index="1" -->
2. Suppliers <!-- .element: class="fragment fade-in-then-semi-out" -->
3. The platform <!-- .element: class="fragment fade-in-then-semi-out" -->

notes: So, imagine there's a brand-new Silicon Valley startup ready to change the world with a revolutionary new online platform. 

- First step: make the best service possible. Users become locked-in (more on this in a moment). 
- Second step: sell the users to the suppliers. "We have a giant platform of users ready to sell your products to, just sell through our platform and we'll give you the best reach possible!" Suppliers become locked-in. 
- Both sides are locked in. Platform can charge however much it wants and people cannot leave. 

Doctorow claims that enshittification is the "inevitable consequence" of a two-sided market. Because both groups are forced to go through the platform to interact, they are held hostage to the platform, or more accurately, held hostage to each other *through* the platform. 

This process is enabled by two key phenomenons that Doctorow discusses, which both underpin the foundations of enshittification. The first is...

That is the network effect at play, and companies like Facebook, Amazon and YouTube all use it to their advantage to entice and trap an enormous amount of users and suppliers on their platform. The bigger, the better, right?

## Switching costs

a.k.a.

### Walled gardens

notes: ... switching costs, essentially the loss incurred by leaving the platform. For example, if all of your friends and family are on Facebook, then leaving Facebook would likely mean cutting contact with the majority of the people important to you in your life. Doctorow argues that the internet, by nature of being digital, has low-switching costs, and accuses tech companies of artificially inflating how hard it *should be* to leave the platform. This idea is essentially cut from the same cloth as "walled gardens," where tech companies intentionally build obstacles to prevent users from being able to leave their ecosystem.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

2. Legislate interoperability<!-- .element: class="fragment fade-in-then-semi-out" -->
3. Restore the "right to hack"<!-- .element: class="fragment fade-in-then-semi-out" -->

notes: Pass legislation to curtail enshit-tery business models, including stronger privacy regulations with a "right of action," apply existing consumer protection laws, and crucially, legislate a requirement for interoperability.

##### Part 2:

## The Socialist Internet

notes: 

- Enshittification is actually a really good theory of describing the situation of modern digital platforms. Whilst Doctorow's initial few blog posts were somewhat limited around the edges, later refinement has turned enshittification into a fantastic explainer that is hard to poke holes into. 
- Fundamentally, Doctorow's theory calls back to a broader critique of capitalism. It's not necessarily anything new, just repackaged and re-explained in the context of the internet, with some more colourful language to engage even the most brain-deprived Reddit mods. 
- Enshittification is not exclusively confined to the internet; capitalism always encourages profit motives -- the internet just made it easier to do without the citizens noticing. 

This is the one problem with enshittification: the theory is more focused on the *whats* and the *hows* rather than considering the *whys* and directly addressing the root causes. An example of this is a small side-note from within Doctorow's article...
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

###### *The Attention Economy* (2)

notes:

... where he briefly discusses the "attention economy." Doctorow claims "\[y]ou can't use attention as a medium of exchange ... \[or] as a store of value," and that "\[y]ou have to 'monetize' it – that is, you have to exchange the fake money for real money." 

The fact is, the attention economy does exist, as Big Tech believes that advertisements can drown out every other company so that the end-user is only aware of one product, or thinks that one product is the best option. The idea is, with enough money and time, you can essentially buy customers. It doesn't matter whether this idea is true or not, this is just what Big Tech believes is possible. Doctorow's idea about real currency being exchanged for fake currency isn't necessarily wrong, but what he forgets is that advertising companies expect that fake money to be re-exchanged for real money in the long run, in the form of buying company product. By dismissing Big Tech's thinking process, it slightly undermines his critical analysis of *why* enshittification happens.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

##### What made the

## "good old" internet

### so damn useful?

notes: Similarly, Doctorow says that he's not interested in bringing back the *old* good internet, but instead wants to make a *new* good internet for everybody. However, to truly accomplish this, we need to understand what made the "good old" internet so damn good in the first place: the people. 

Back when the internet was first created, the people using the internet were the people who *wanted* to be there: developers, nerds, and academic researches. Web 1.0 didn't have enshittification because there were no capitalist motivators on the internet yet, everything was collaborative and built by the people, for the people. This is fundamentally what made the old internet so good, because the only focus was how to improve the internet for *everybody*. It was a socialist environment, everybody taking what they wanted and contributing what they could. 

This environment is still seen in parts of the internet today. Take ...
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Case Study:

# Wikipedia

notes: ... Wikipedia, arguably the worlds greatest singular knowledge base, covering practically every subject of interest to humanity. Wikipedia is a success because of the people behind it, the millions of editors worldwide all contributing to keep making Wikipedia a better resource. Despite 25 years of internet enshittification, Wikipedia is still alive and, crucially, *healthy* today because of the community culture that power the platform. Wikipedia proves that a socialist environment is still possible on the internet, and it's just one of thousands of projects that run like this on the internet; if you're curious, look up "free and open source software" after this presentation. Capitalism is unsustainable on the internet because it falls into the enshitt-ery trap that Doctorow describes, and as such, capitalism is fundamentally unfit for the internet. Or, at least, the internet Doctorow wants to build. Doctorow never acknowledges this directly, but when you consider the socialist streak running through his proposed solutions, enshittification starts to make a lot more sense. 

Now, I know that there is one final question about enshittification that I've been dancing around for the entirety of this presentation, and I know that the keen thinkers of you in the audience are already picturing it: "If the internet was all about people in the first place, and more socialised, democratic, and decentralised models of working are still possible, then how did enshittification even come to be in the first place?"
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## The problem with people<!-- .element: class="r-fit-text" -->

notes:

This is the fundamental problem of people: humans like shiny things. When the internet shifted from a nerd-centric model to a society-centric model, people stopped caring about morals and standards and how things worked under-the-hood; all people cared about was that they could turn on their computer, and it would just work. As touched on by reviewer Kevin Crane, platforms like Facebook and Twitter didn't have to convince people they were technically superior, because people stopped caring about technicality. They were user friendly to the general population, and people cared about ease-of-use over standards. Facebook was the shiny new thing. The network effect and others did the rest. 

The only way that the internet will be able to improve is when everybody, collectively, rises up against the oppression from Big Tech and embraces open standards. And this is the core reason of why I applaud Doctorow's theory. It's why my critiques of enshittification are minor nitpicks at best rather than being a 'smoking gun' that disproves Doctorow's thought process, because enshittification is not designed to be foolproof. It's designed to raise attention to the cause, and to advocate for a movement stepping in the right direction, to mobilise the troops and show people why these platforms aren't as shiny as they present themselves to be. The most important thing? Enshittification is achieving this goal. It's *working*.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Conclusion

notes:

The 3 step process of enshittification is prevelant in every major platform on the internet today. Made possible by the network effect and walled gardens that artificially increase switching costs, internet users are increasingly trapped in siloed, worsening online platforms. Enshittification struggles at breaking down the *why*, but it doesn't have to. It is succeeding at educating millions of people around the world, an explainer that nothing before it has topped. 

...

For the betterment of society, we need an internet that returns to it's foundations of open standards, an internet that serves the people, and the solutions proposed in Doctorow's theory are some fantastic steps that society could take to get there. A socialist, decentralised internet is the way forward, and with growing awareness of enshittification, a new "good" internet is closer to reality every day. The capitalist enshittification of the internet might be finally coming to an end. The only thing left to do? Follow Cory Doctorow's advice. It's time to kill it with fire. Thank you.

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}
