	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};


        </script>

# Enshittification<!-- .element: class="r-fit-text" -->

#### Why we need a more socialist, decentralised internet

notes: Cory Doctrow's theory of enshittification is a fantastic explanation for how the internet has evolved over time, but his proposed solutions to create a new web turns a blind eye to the core foundation of the internet. 

The internet will still be able to function under a capitalist model, which, when monetary gain is on the table, is always going to end badly.

##### Part 1:

## How did we get here?

notes: "Here is how platforms die: first, they are good to their users; then they abuse their users to make things better for their business customers; finally, they abuse those business customers to claw back all the value for themselves. Then, they die." These words, written by Cory Doctrow for his blog, `pluralistic.net`, in early 2023, are the shortest, most succinct definition of enshittifcation. It outlines a 3 step process for the lifetime of online platforms, each step defined by how these platforms allocate "surplus value," essentially a fancy word for "profit".
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

The 3 step process: <!-- .element: class="fragment semi-fade-out" data-fragment-index="1" -->

1. Users <!-- .element: class="fragment fade-in-then-semi-out" data-fragment-index="1" -->
2. Suppliers <!-- .element: class="fragment fade-in-then-semi-out" -->
3. The platform <!-- .element: class="fragment fade-in-then-semi-out" -->

notes: So, imagine there's a brand-new Silicon Valley startup ready to change the world with a revolutionary new online platform. 

- First step: make the best service possible. Users become locked-in (more on this in a moment). 
- Second step: sell the users to the suppliers. "We have a giant platform of users ready to sell your products to, just sell through our platform and we'll give you the best reach possible!" Suppliers become locked-in. 
- Both sides are locked in. Platform can charge however much it wants and people cannot leave. 

Doctrow claims that enshittification is the "inevitable consequence" of a two-sided market. Because both groups are forced to go through the platform to interact, they are held hostage to the platform, or more accurately, held hostage to each other *through* the platform. 

This process is enabled by two key phenomenons that Doctrow discusses, which both underpin the foundations of enshittification. The first is...
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Switching costs

a.k.a.

### Walled gardens

notes: ... switching costs, essentially the loss incurred by leaving the platform. For example, if all of your friends and family are on Facebook, then leaving Facebook would likely mean cutting contact with the majority of the people important to you in your life. Doctrow argues that tech companies make this intentionally harder than it needs to be, by forcing user data to be tied exclusively to their platform. This idea is basically the same as the concept of "walled gardens," where tech companies intentionally build walls to prevent users from being able to leave their ecosystem.

##### Part 2:

## The Socialist Internet

notes: Fundamentally, Doctrow's theory calls back to a broader critique of capitalism. Two-sided market? Just look at Woolworths and Coles, jacking up prices every day whilst taking a larger and larger cut for themselves! Enshittification is not exclusively confined to the internet; capitalism always encourages profit motives -- the internet just made it easier to do without the citizens noticing.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

XKCD #927: "Standards" (1) <!-- TODO: reference!!! -->

notes: The problem with standardisation is that nobody knows how to do it. What is to stop Facebook creating their own, alternative protocol? Or if Facebook's API did not discriminate between ads and posts? What about Microsoft's "Embrace, extend, extinguish" strategy? Is extending an existing API or protocol a bad thing?

There are risks attempting to regulate these standards, and could likely create unforseen loopholes that bad actors (like Facebook) could use to avoid true interoperability. Whilst interoperability is absolutely a good thing, it does not entirely address the underlying problem.

# Conclusion

notes:

"The internet that it was designed to be, one for sharing information and ideas around the world, one for advancing the human race, not for mere profit and commercialisation. We need an internet that returns to it's community foundations, one that serves the people, and the only way we can get there is by eliminating capitalism from the internet entirely. A socialist internet is the way forward, and is the only true way to get back the good old internet. But alas, it may take a lot more time and patience before we can get there."

There is hope for a community-run internet, and it still survives to an extent today. The only way that we can get there is if we eliminate the capitalist internet and return to what made the internet so valuable in the first place: the people. <!-- TODO reword this a little bit please -->

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
	var isLight = isLight(bgColor);

	if(isLight){
		document.body.classList.add('has-light-background');
	} else {
		document.body.classList.add('has-dark-background');
	}
