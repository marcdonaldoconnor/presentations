		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}

			}
			forgetPop = true;

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

# Enshittification<!-- .element: class="r-fit-text" -->

#### Why we need a more socialist, decentralised internet

notes: Cory Doctrow's theory of enshittification is a fantastic explanation for how the internet has evolved over time, but his proposed solutions to create a new web turns a blind eye to the core foundation of the internet. 

The internet will still be able to function under a capitalist model, which, when monetary gain is on the table, is always going to end badly.

##### Part 1:

## How did we get here?

notes: "Here is how platforms die: first, they are good to their users; then they abuse their users to make things better for their business customers; finally, they abuse those business customers to claw back all the value for themselves. Then, they die." These words, written by Cory Doctrow for his blog, `pluralistic.net`, in early 2023, are the shortest, most succinct definition of enshittifcation. It outlines a 3 step process for the lifetime of online platforms, each step defined by how these platforms allocate "surplus value," essentially a fancy word for "profit".
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

The 3 step process: <!-- .element: class="fragment semi-fade-out" data-fragment-index="1" -->

1. Users <!-- .element: class="fragment fade-in-then-semi-out" data-fragment-index="1" -->
2. Suppliers <!-- .element: class="fragment fade-in-then-semi-out" -->
3. The platform <!-- .element: class="fragment fade-in-then-semi-out" -->

notes: So, imagine there's a brand-new Silicon Valley startup ready to change the world with a revolutionary new online platform. 

- First step: make the best service possible. Users become locked-in (more on this in a moment). 
- Second step: sell the users to the suppliers. "We have a giant platform of users ready to sell your products to, just sell through our platform and we'll give you the best reach possible!" Suppliers become locked-in. 
- Both sides are locked in. Platform can charge however much it wants and people cannot leave. 

Doctrow claims that enshittification is the "inevitable consequence" of a two-sided market. Because both groups are forced to go through the platform to interact, they are held hostage to the platform, or more accurately, held hostage to each other *through* the platform. 

This process is enabled by two key phenomenons that Doctrow discusses, which both underpin the foundations of enshittification. The first is...
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## Switching costs

a.k.a.

### Walled gardens

notes: ... switching costs, essentially the loss incurred by leaving the platform. For example, if all of your friends and family are on Facebook, then leaving Facebook would likely mean cutting contact with the majority of the people important to you in your life. Doctrow argues that tech companies make this *intentionally harder* than it needs to be, by forcing user data to be tied exclusively to their platform. This idea is basically the same as the concept of "walled gardens," where tech companies intentionally build walls to prevent users from being able to leave their ecosystem.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### Proposed solutions<!-- .element: class="fragment semi-fade-out" data-fragment-index="1" -->

1. Break up Big Tech<!-- .element: class="fragment fade-in-then-semi-out" data-fragment-index="1" -->
2. Legislate interoperability<!-- .element: class="fragment fade-in-then-semi-out" -->
3. Restore the "right to hack"<!-- .element: class="fragment fade-in-then-semi-out" -->
4. Supportive government policy<!-- .element: class="fragment fade-in-then-semi-out" -->

notes: Pass legislation to curtail enshit-tery business models, including stronger privacy regulations with a "right of action," apply existing consumer protection laws, and crucially, legislate a requirement for interoperability.

##### Part 2:

## The Socialist Internet

notes: 

- Fundamentally, Doctrow's theory calls back to a broader critique of capitalism. It's not necessarily anything new, just repackaged and re-explained in the context of the internet, with some more colourful language to engage even the most brain-deprived Reddit mods. 
	- Two-sided market? Just look at Woolworths and Coles, jacking up prices every day whilst taking a larger and larger cut for themselves!
	- Break up Big Tech? Break up any monopoly that harms customers!
- Enshittification is not exclusively confined to the internet; capitalism always encourages profit motives -- the internet just made it easier to do without the citizens noticing. 
- At a deeper level, enshittification is all about making the internet more resistant from single monopolies and giving more power to the people. However, Doctrow never acknowledges this directly, and it's only once this fact is discovered that enshittification truly makes sense. This is the one and only major problem with enshittification: the theory is more focused on the *whats* and the *hows* rather than considering the *whys* and directly addressing the root causes.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

<img src="https://imgs.xkcd.com/comics/standards.png" alt="" style="object-fit: scale-down">

XKCD #927: "Standards" (1) <!-- TODO: reference!!! -->

notes: The problem with standardisation is that nobody knows how to do it. What is to stop Facebook creating their own, alternative protocol? Or if Facebook's API did not discriminate between ads and posts? What about Microsoft's "Embrace, extend, extinguish" strategy? Is extending an existing API or protocol a bad thing?

There are risks attempting to regulate these standards, and could likely create unforseen loopholes that bad actors (like Facebook) could use to avoid true interoperability. Whilst interoperability is absolutely a good thing, it does not entirely address the underlying problem.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

## "good old" internet

### so damn useful?

notes: Doctrow says that he's not interested in bringing back the old good internet, but instead wants to make a new good internet for everybody. However, to truly accomplish this, we need to understand what made the "good old" internet so damn good in the first place: the people. 

It was the people that laid the foundation of the internet, just for billionaries like Elon Musk and Mark Zuckerburg to walk through the door and shit all over the nice porcelain floor.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Case Study:

# Wikipedia

notes: Of creating a platform where users are the content-drivers, without monetising. <!-- TODO: switch this to mastodon? or merge this with the previous argument? this entire section could do with improvements-->

...

Now, I know that there is one final question about enshittification that I've been dancing around for the entirety of this presentation, and I know that the keen thinkers of you in the audience are already picturing it: "If the internet was all about people in the first place, and more socialised, democratic, and decentralised models of working are still possible, then how did enshittification even come to be in the first place?" The sad thing is, the internet nerds of the "good old" internet warned that this was happening, and nobody listened.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## The problem with people<!-- .element: class="r-fit-text" -->

notes:

This is the fundamental problem of people: humans like shiny things. When the internet shifted from a nerd-centric model to a society-centric model, people stopped caring about morals and standards and how things worked under-the-hood; all people cared about was that they could turn on their computer, and it would just work. Once the focus on technical prowess and collaboration was lost, in the startup era, platforms like Facebook and Twitter didn't have to convince people they were technically superior to the standards-based model of the old internet, because people stopped caring. There was a shiny new thing to try, and humans love shiny new things. The network effect et al. did the rest. 

Doctrow never covers this explicitly, because he believes that humans are better than this. He has too, otherwise the decentralisation model would never work!

The only way that the internet will be able to improve is when everybody, collectively, rises up against the oppression from Big Tech and embraces open standards. And this is the core reason of why, even with my minor nitpicking, I applaud Doctrow's theory. Enshittification as a concept is spreading faster and bringing more awareness about the technical side of the internet than any argument or concept before it, and the long-term education of *how* and *why* the internet works will be immensely beneficial for society, and crucial to the ushering in of a better, modern internet.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Conclusion

notes:

...

The internet that it was designed to be, one for sharing information and ideas around the world, one for advancing the human race, not for mere profit and commercialisation. We need an internet that returns to it's foundations of open standards, an internet that serves the people, and the solutions proposed in Doctrow's theory are some fantastic steps that society could take to get there. A socialist, decentralised internet is the way forward, and a new "good" internet is closer to reality every day. With growing awareness, the capitalist enshittification of the internet might be finally coming to an end. The only thing left to do? Follow Cory Doctrow's advice. It's time to kill it with fire. Thank you.

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}
